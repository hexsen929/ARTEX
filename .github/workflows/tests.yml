name: tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: artex_test
          POSTGRES_DB: artex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex_test -d artex_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex_test:artex_test@127.0.0.1:5432/artex_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Reject local-only tracked files
        run: |
          test -z "$(git ls-files -- doc docs data .codegraph '*.bak' '*.log' config.json .env jwt.key)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests
        run: go test ./... -p 2 -count=1 -timeout=5m
      - name: Go static checks
        run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Frontend unit tests
        run: node --experimental-strip-types --test src/lib/*.test.mjs
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build:static
        working-directory: web
