name: tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compile every test package without running TestMain
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          failed=0
          for package in $(go list ./...); do
            echo "Compile $package"
            if ! go test -c -o "$scratch/package.test" "$package" > "$scratch/compiler.log" 2>&1; then
              cat "$scratch/compiler.log"
              CI_LOG="$scratch/compiler.log" CI_PACKAGE="$package" python3 -c 'import os,pathlib; s=pathlib.Path(os.environ["CI_LOG"]).read_text(errors="replace")[-18000:]; s=s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print("::error title=Go compile "+os.environ["CI_PACKAGE"]+"::"+s)'
              failed=1
            fi
            rm -f "$scratch/package.test"
          done
          exit "$failed"
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: artex_test
          POSTGRES_DB: artex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex_test -d artex_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex_test:artex_test@127.0.0.1:5432/artex_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Reject local-only tracked files
        run: |
          test -z "$(git ls-files -- doc docs data .codegraph '*.bak' '*.log' config.json .env jwt.key)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests with package-isolated databases
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          index=0
          for package in $(go list ./...); do
            database="artex_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${index}"
            docker exec "$PG_CONTAINER" createdb -U artex_test "$database"
            if [[ "$package" == */server ]]; then
              instructions="artex_instructions_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
              docker exec "$PG_CONTAINER" createdb -U artex_test "$instructions"
              export ARTEX_INSTRUCTIONS_TEST_DSN="postgres://artex_test:artex_test@127.0.0.1:5432/${instructions}?sslmode=disable"
            else
              unset ARTEX_INSTRUCTIONS_TEST_DSN
            fi
            test_log="$(mktemp)"
            result=0
            ARTEX_PG_DSN="postgres://artex_test:artex_test@127.0.0.1:5432/${database}?sslmode=disable" \
              go test "$package" -count=1 -timeout=5m > "$test_log" 2>&1 || result=$?
            cat "$test_log"
            if [[ "$result" -ne 0 ]]; then
              CI_LOG="$test_log" CI_PACKAGE="$package" python3 -c 'import os,pathlib; s=pathlib.Path(os.environ["CI_LOG"]).read_text(errors="replace")[-18000:]; s=s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print("::error title=Go test "+os.environ["CI_PACKAGE"]+"::"+s)'
              exit "$result"
            fi
            rm -f "$test_log"
            index=$((index + 1))
          done
      - name: Go static checks
        run: go vet ./...
      - name: MCP lifecycle concurrency regressions
        run: |
          go test -race ./server -run 'Test(LazyMCP|MCPSlotQueue|LeasedMCP|ManagerClose)' -count=1 -timeout=3m
          go test -race ./traffic -run 'TestSharedProxy' -count=1 -timeout=3m

  # Run frontend checks independently: backend compilation failures must not
  # hide TypeScript or UI regressions during a cross-cutting source port.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Frontend unit tests
        run: node --experimental-strip-types --test src/lib/*.test.mjs
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build:static
        working-directory: web
