name: tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  # Pin the validated image: ubuntu-latest now selects 26.04, which is not
  # supported by the pinned Playwright browser runtime used below.
  tool-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tool deployment integrity and isolation regressions
        run: python3 -m unittest discover -s packaging -p 'test_*.py'

  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compile every test package without running TestMain
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          failed=0
          packages="$(go list ./...)"
          for package in $packages; do
            echo "Compile $package"
            if ! go test -c -o "$scratch/package.test" "$package" > "$scratch/compiler.log" 2>&1; then
              cat "$scratch/compiler.log"
              CI_LOG="$scratch/compiler.log" CI_PACKAGE="$package" python3 -c 'import os,pathlib; s=pathlib.Path(os.environ["CI_LOG"]).read_text(errors="replace")[-18000:]; s=s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print("::error title=Go compile "+os.environ["CI_PACKAGE"]+"::"+s)'
              failed=1
            fi
            rm -f "$scratch/package.test"
          done
          exit "$failed"
      - name: Mac ARM64 application compile
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o "$scratch/artex" ./cmd/artex
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: artex_test
          POSTGRES_DB: artex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex_test -d artex_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex_test:artex_test@127.0.0.1:5432/artex_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Reject local-only tracked files
        run: |
          test -z "$(git ls-files -- doc docs data .codegraph '*.bak' '*.log' config.json .env jwt.key)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests with package-isolated databases
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          index=0
          failed=0
          packages="$(go list ./...)"
          for package in $packages; do
            database="artex_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${index}"
            docker exec "$PG_CONTAINER" createdb -U artex_test "$database"
            if [[ "$package" == */server ]]; then
              instructions="artex_instructions_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
              docker exec "$PG_CONTAINER" createdb -U artex_test "$instructions"
              export ARTEX_INSTRUCTIONS_TEST_DSN="postgres://artex_test:artex_test@127.0.0.1:5432/${instructions}?sslmode=disable"
            else
              unset ARTEX_INSTRUCTIONS_TEST_DSN
            fi
            test_log="$(mktemp)"
            result=0
            ARTEX_PG_DSN="postgres://artex_test:artex_test@127.0.0.1:5432/${database}?sslmode=disable" \
              go test "$package" -count=1 -timeout=5m > "$test_log" 2>&1 || result=$?
            cat "$test_log"
            if [[ "$result" -ne 0 ]]; then
              CI_LOG="$test_log" CI_PACKAGE="$package" python3 -c 'import os,pathlib,re; raw=pathlib.Path(os.environ["CI_LOG"]).read_text(errors="replace"); lines=raw.splitlines(); bad=[i for i,line in enumerate(lines) if line.startswith(("--- FAIL:","panic:","fatal error:")) or re.search(r"\S+_test\.go:\d+:",line)]; selected=sorted({j for i in bad for j in range(max(0,i-1),min(len(lines),i+9))}); s=("\n".join(lines[j] for j in selected) if selected else raw[-18000:])[:18000]; s=s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print("::error title=Go test "+os.environ["CI_PACKAGE"]+"::"+s)'
              failed=1
            fi
            rm -f "$test_log"
            index=$((index + 1))
          done
          exit "$failed"
      - name: Go static checks
        run: go vet ./...
      - name: Execution reliability regressions
        run: |
          set -euo pipefail
          go test -race -p=1 -v ./db ./intercept ./agent ./server -run '^TestExecution' -count=1 -timeout=4m | tee "$RUNNER_TEMP/execution-reliability.log"
          for case in ExecutionHydraMigrationPreservesApprovalPolicy ExecutionOutcomeGenerationCannotSettleNewRun ExecutionApprovalWaitCanceledRunNeverExecutesLateApproval ExecutionApprovalBudgetIsNotReportedAsExplorationFailure ExecutionCompactionCanceledAndBoundedRounds ExecutionCompactionFailurePreservesPreviousCoverage ExecutionOutcomeRetryAndOrphanRecovery ExecutionBrowserTrustPinsOnlyRecordingCA ExecutionPlannerDispatchIsAtomicAndMetadataSurvives ExecutionPlanningSchemaMigrationPreservesCustomizations ExecutionStagnationSignalsPreserveMeaningfulDifferences ExecutionPlannerReadinessRepairsStoredLegacyBody ExecutionGoalProofRejectsInferenceAndCommitsAtomically ExecutionPlannerReadsLatestOutputBeyondHistoryPage ExecutionCorruptHistoryCannotSilentlyRestartWorker ExecutionScenarioGuidanceDoesNotUndoEvidenceCalibration ExecutionStartupRecoveryFailureBlocksAllStartPaths ExecutionClaimGenerationPrecedesWorkerSetup ExecutionCompactionRejectsChangedSourceBeforePublication ExecutionFactConfirmationKeepsEvidenceAndScope ExecutionFactConfirmationSchemaPreservesPolicy ExecutionStableCheckIdentitySurvivesWordingAndFailures ExecutionCheckpointAtomicityAndContinuation ExecutionCheckContinuationToolKeepsOriginalSession ExecutionEnginePersistsActualToolCheckpoint; do
            grep -q -- "^--- PASS: Test${case} " "$RUNNER_TEMP/execution-reliability.log"
          done
      - name: Proxy progress and protocol detection regressions
        run: |
          set -euo pipefail
          go test -race -v ./server -run '^TestProxyPool(Progress|AutoProtocol)' -count=1 -timeout=3m | tee "$RUNNER_TEMP/proxy-progress.log"
          for name in ProgressAndInteractiveResultWinsBatch ProgressCancelLeavesHealthUnchanged AutoProtocolPersistsOnlyVerifiedCandidate AutoProtocolWithRealSOCKS5Handshake; do
            grep -q -- "^--- PASS: TestProxyPool${name} " "$RUNNER_TEMP/proxy-progress.log"
          done
      - name: MCP lifecycle concurrency regressions
        run: |
          go test -race ./server -run 'Test(LazyMCP|MCPSlotQueue|LeasedMCP|ManagerClose)' -count=1 -timeout=3m
          go test -race ./traffic -run 'TestSharedProxy' -count=1 -timeout=3m
          go test -race ./agent -run 'Test(ChatProxyOverride|ChatPreservesParent|ConcurrentTaskChats)' -count=1 -timeout=3m
          go test -race ./server -run 'Test(SideCheckpoint|TaskDeleteCheckpoint|SideTaskDrain)' -count=1 -timeout=3m
          go test -race ./server -run 'Test(Proxy|DynamicForward|DialHTTPConnect|SideTaskContext|SideTaskSynthetic|SideTaskFallback|HealthGate|VersionRequires)' -count=1 -timeout=5m
          go test -race ./agent ./guard ./intercept/... ./llmhttp -run 'Test(DeepSeek|Jev|NewClient|Review|Confidence)' -count=1 -timeout=5m
          go test -race ./db -run 'Test(JevProfile|ActiveProfileActivation|ActiveLLMProfileLock)' -count=1 -timeout=5m
          go test -race -p=1 ./memory ./db ./server -run 'Test(MemoryOutcome|MemoryResult|MemoryExplicit|MemoryDuplicate|MemorySettingsClear|MemorySettingsFailure|MemorySkipUnreadable|MemoryLate|MemoryFailureMetadata|MemoryThird|MemoryBudgetRelease|MemoryClosed|MemoryLearning|MemoryWorker|MemoryExperienceLearning|ExtractDetailed|DiagnosticCode|AuthorizationPlaceholder|BareTargetAliases)' -count=1 -timeout=5m
          go test -race ./agent -run 'Test(TaskAssociatedVerifierSideCapture|SideCaptureParent)' -count=1 -timeout=3m
          go test -race ./agent ./llmguard -run 'Test(ResponsesError|StructuredProviderError|StructuredStatus|OnlyConcreteTransport|CancellationWinsOverStructured)' -count=1 -timeout=3m
          go test -race ./server -run 'Test(RuntimeMerge|MergeScreenshot|MergeAutoTitle|MergeFindingSide)' -count=1 -timeout=3m
          go test -race ./guard -run 'Test(Extract|RoE)' -count=1 -timeout=3m
          go test -race ./server -run 'Test(ChatProfileWiring|TaskAgentBindingWiring|RuntimeControlRoutes|RoESettings|InstalledSkillDefaultsStartup|SkillDefaultsPending|NotifierSettingsWiring)' -count=1 -timeout=5m
          go test -race -p=1 ./agent ./server -run 'Test(TaskTool|TaskDomain|TaskAssemblyWarnings|ExplanationOnly|ChatExplanation|SeedUnlockFromHistory|SkillMCPDependencyWarnings|Custom)' -count=1 -timeout=5m
          go test -race ./db -run '^TestTaskArchive.*Retest' -count=1 -timeout=5m
          go test -race ./server -run 'Test(TaskConversation|Retest|VerifierContext|SealedVerifier)' -count=1 -timeout=5m

  checkpoint-postgres-18:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: artex_test
          POSTGRES_DB: artex_checkpoint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex_test -d artex_checkpoint_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex_test:artex_test@127.0.0.1:5432/artex_checkpoint_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PostgreSQL 18 Unicode checkpoint round-trip regressions
        run: |
          set -euo pipefail
          db_log="$RUNNER_TEMP/checkpoint-pg18-db.log"
          server_log="$RUNNER_TEMP/checkpoint-pg18-server.log"
          go test -race -v ./db -run 'Test(JsonbClean|SideSnapshotRawUnicodeJSONBRoundTrip|JSONBNormalizationAcceptsUnicodeBoundaries)' -count=1 -timeout=5m | tee "$db_log"
          go test -race -v ./server -run '^TestTaskDeleteCheckpoint' -count=1 -timeout=5m | tee "$server_log"
          # A fixture that skipped because database/schema setup failed is not
          # evidence of PostgreSQL 18 acceptance. Require real PASS events.
          for name in TestSideSnapshotRawUnicodeJSONBRoundTrip TestJSONBNormalizationAcceptsUnicodeBoundaries; do
            grep -q -- "^--- PASS: $name " "$db_log"
          done
          for name in TestTaskDeleteCheckpointPermanentFailureDoesNotBlockExplicitDeletion TestTaskDeleteCheckpointDatabaseFailurePreservesUnsavedState TestTaskDeleteCheckpointStopWaitsForActualSideRunExit TestTaskDeleteCheckpointLateInFlightSaveCannotReviveCommittedDeletion; do
            grep -q -- "^--- PASS: $name " "$server_log"
          done

      - name: PostgreSQL 18 memory outcomes and abandoned leases
        run: |
          set -euo pipefail
          memory_log="$RUNNER_TEMP/memory-outcomes-pg18.log"
          go test -race -v ./db -run '^TestMemory(ResultClosed|ExplicitOutcomes|DuplicateOutcome|SettingsClear|LateOutcome|FailureMetadata|ThirdExpiredLease|BudgetRelease|ClosedOutcomeCategories|SkipUnreadable|SettingsFailure|LearningSnapshot)' -count=1 -timeout=5m | tee "$memory_log"
          grep -q -- '^--- PASS: TestMemoryExplicitOutcomesAreDistinctFromLegacyAndUnknown ' "$memory_log"
          grep -q -- '^--- PASS: TestMemoryBudgetReleaseWaitsForBothWindowsAndLoweredLimit ' "$memory_log"
          grep -q -- '^--- PASS: TestMemoryThirdExpiredLeaseTerminatesWithoutFourthAttempt ' "$memory_log"

      - name: PostgreSQL 18 task tool binding and retest archive history
        run: |
          set -euo pipefail
          task_tools_log="$RUNNER_TEMP/task-tools-pg18.log"
          retest_archive_log="$RUNNER_TEMP/retest-archives-pg18.log"
          go test -race -v ./server -run '^Test(TaskToolRegistry|TaskConversation)' -count=1 -timeout=5m | tee "$task_tools_log"
          go test -race -v ./db -run '^TestTaskArchive.*Retest' -count=1 -timeout=5m | tee "$retest_archive_log"
          grep -q -- '^--- PASS: TestTaskToolRegistryWorkerExecuteUsesTaskLocalReader ' "$task_tools_log"
          grep -q -- '^--- PASS: TestTaskToolRegistryConcurrentWorkersStayIsolated ' "$task_tools_log"
          grep -q -- '^--- PASS: TestTaskConversationDeleteWaitsForActualProviderExit ' "$task_tools_log"
          grep -q -- '^--- PASS: TestTaskConversationRetestCarriesTaskContextAndPrivateProxy ' "$task_tools_log"
          grep -q -- '^--- PASS: TestTaskConversationGenericTriggerRejectsBeforeCreatingConversationOrBody ' "$task_tools_log"
          grep -q -- '^--- PASS: TestTaskConversationFindingCancellationAtValidateAndStartIsStopped ' "$task_tools_log"
          grep -q -- '^--- PASS: TestTaskArchiveRetestConversationAndApprovalRoundTrip ' "$retest_archive_log"
          grep -q -- '^--- PASS: TestTaskArchiveRetestSharedConversationRemainsHotAndDetached ' "$retest_archive_log"
          grep -q -- '^--- PASS: TestTaskArchiveRetestForeignIntentReferenceBlocksCompaction ' "$retest_archive_log"
          grep -q -- '^--- PASS: TestTaskArchiveRetestColdStubDeletePreservesForeignExplorationSide ' "$retest_archive_log"

  # Run frontend checks independently: backend compilation failures must not
  # hide TypeScript or UI regressions during a cross-cutting source port.
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Frontend unit tests
        run: |
          node --experimental-strip-types --test src/lib/*.test.mjs
          node --test src/lib/*.test.cjs
          node --test src/lib/mock/*.test.cjs
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - name: Prepare isolated browser regression runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/credential-ui-browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/credential-ui-runtime" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/credential-ui-runtime/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser recording CA isolation regression
        env:
          ARTEX_PLAYWRIGHT_DIR: ${{ runner.temp }}/credential-ui-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/credential-ui-browsers
        run: node scripts/browser-recording-ca-smoke.cjs
        working-directory: web
      - name: Credential management browser regressions
        env:
          ARTEX_PLAYWRIGHT_DIR: ${{ runner.temp }}/credential-ui-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/credential-ui-browsers
          ARTEX_UI_ARTIFACTS: ${{ runner.temp }}/credential-ui-artifacts
        run: node scripts/credential-ui-smoke.cjs
        working-directory: web
      - name: Merged findings filters and report browser regressions
        env:
          ARTEX_PLAYWRIGHT_DIR: ${{ runner.temp }}/credential-ui-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/credential-ui-browsers
        run: node scripts/newfindingmerge-ui-smoke.cjs
        working-directory: web
      - name: Runtime policy settings browser regressions
        env:
          ARTEX_PLAYWRIGHT_DIR: ${{ runner.temp }}/credential-ui-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/credential-ui-browsers
        run: node scripts/roe-settings-ui-smoke.cjs
        working-directory: web
      - name: Large proxy pool settings browser regressions
        env:
          ARTEX_PLAYWRIGHT_DIR: ${{ runner.temp }}/credential-ui-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/credential-ui-browsers
        run: node scripts/proxy-pool-scale-ui-smoke.cjs
        working-directory: web
      - name: Notification and tool editor browser regressions
        env:
          ARTEX_PLAYWRIGHT_DIR: ${{ runner.temp }}/credential-ui-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/credential-ui-browsers
        run: node scripts/notification-tool-ui-wiring-smoke.cjs
        working-directory: web
      - name: Module status and recording browser regressions
        env:
          ARTEX_PLAYWRIGHT_DIR: ${{ runner.temp }}/credential-ui-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/credential-ui-browsers
        run: node scripts/routes-status-wiring-smoke.cjs
        working-directory: web
      - name: Update lifecycle browser regressions
        env:
          ARTEX_PLAYWRIGHT_DIR: ${{ runner.temp }}/credential-ui-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/credential-ui-browsers
        run: node scripts/update-lifecycle-ui-smoke.cjs
        working-directory: web
      - name: Repeater draft lifecycle and late response regressions
        env:
          ARTEX_PLAYWRIGHT_DIR: ${{ runner.temp }}/credential-ui-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/credential-ui-browsers
        run: node scripts/repeater-seed-lifecycle-ui-smoke.cjs
        working-directory: web
      - name: Shared automatic memory browser regressions
        env:
          ARTEX_PLAYWRIGHT_DIR: ${{ runner.temp }}/credential-ui-runtime/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/credential-ui-browsers
          ARTEX_UI_ARTIFACTS: ${{ runner.temp }}/memory-ui-artifacts
        run: node scripts/memory-ui-smoke.cjs
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-ui-regression
          path: ${{ runner.temp }}/credential-ui-artifacts
          if-no-files-found: ignore
