name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_version:
        description: "构建版本（例如 2.3.5-codex-config；手动运行不创建 Release）"
        required: false
        type: string
        default: ""
      prepare_macos_tools:
        description: "验证 Mac ARM64 外部工具并生成 Python wheelhouse（云端构建依赖）"
        required: false
        type: boolean
        default: false
      python_wheelhouse_run:
        description: "可选：复用本仓库已构建的 Python wheelhouse 工作流编号，安装时仍核对固定来源与全部摘要"
        required: false
        type: string
        default: ""

permissions:
  contents: write # 创建 Release 需要
  actions: read # 显式复用本仓库已验证的依赖构建产物

jobs:
  tool-runtimes:
    if: ${{ inputs.prepare_macos_tools == true }}
    uses: ./.github/workflows/tools-macos.yml
    with:
      python_wheelhouse_run: ${{ inputs.python_wheelhouse_run || '' }}

  verify:
    # Reusable workflow succeeds only after both Go regression and frontend
    # validation jobs succeed. No release/build job may bypass that result.
    uses: ./.github/workflows/tests.yml

  # ① 前端静态导出（一次），产物给交叉编译各平台复用
  frontend:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② 五平台交叉编译（内嵌前端）+ 打 zip
  binaries:
    needs: [verify, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ inputs.build_version || github.ref_name }}
          ARTEX_RELEASE_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化和安全策略下会崩溃。
          # Release 使用 Go linker 裁剪和 zip 压缩，优先保证可移植性。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Linux 生二进制单独上传，供 docker job 复用（免在镜像里重编前端+Go）
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ 汇总所有 zip → 创建 GitHub Release
  release:
    needs: binaries
    # 仅在推送 tag（refs/tags/*）时创建 GitHub Release；手动触发时跳过。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read release notes from matching changelog section
        run: |
          python3 - <<'PYNOTES'
          import os, re
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = Path("CHANGELOG.md").read_text()
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, text, re.MULTILINE | re.DOTALL)
          if not match or not match.group(1).strip():
              raise SystemExit(f"Missing CHANGELOG.md section for {version}")
          Path("release-notes.md").write_text(match.group(1).strip() + "\n")
          PYNOTES
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      - name: Sign checksums when this fork has a release key
        if: ${{ vars.MINISIGN_PUBLIC_KEY != '' }}
        working-directory: dist
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$MINISIGN_KEY"
          curl -fsSL -o minisign.tar.gz https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  minisign.tar.gz" | sha256sum -c -
          tar xzf minisign.tar.gz
          umask 077
          trap 'rm -f minisign.key' EXIT
          printf '%s\n' "$MINISIGN_KEY" > minisign.key
          ./minisign-linux/x86_64/minisign -S -s minisign.key -m SHA256SUMS
          ./minisign-linux/x86_64/minisign -Vm SHA256SUMS -P "$MINISIGN_PUBLIC_KEY"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
            dist/*.minisig
          body_path: release-notes.md

  # ④ 多架构镜像 → 推 Docker Hub（复用 binaries 编好的 Linux 二进制，
  #    镜像里只装工具 + 放二进制；arm64 仅需模拟 apt 层，构建快很多）
  docker:
    needs: binaries
    # 这个 fork 默认不发布 Docker 镜像（原仓库推到 autumn27/artex，你没有那个账号的密钥，
    # 跑了必定失败并把整条流水线标红）。需要时：
    #   1) 仓库 Settings → Secrets and variables → Actions → Variables 新增 PUBLISH_DOCKER=true
    #   2) 新增 Secret：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN
    #   3) 把下面 metadata-action 的 images 改成你自己的 用户名/artex
    if: ${{ vars.PUBLISH_DOCKER == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 取 Dockerfile 与 skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKER_IMAGE || 'hexsen929/artex' }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
